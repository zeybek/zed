[package]
name = "database_core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/database_core.rs"
doctest = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
context_server.workspace = true
credentials_provider.workspace = true
db.workspace = true
extension.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_tokio.workspace = true
http_client_tls.workspace = true
log.workspace = true
mysql_async.workspace = true
net.workspace = true
percent-encoding.workspace = true
project.workspace = true
remote.workspace = true
rusqlite = { workspace = true, features = ["column_decltype", "hooks"] }
rustls.workspace = true
rustls-platform-verifier.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
shellexpand.workspace = true
telemetry.workspace = true
tokio = { workspace = true, features = ["fs", "net", "rt", "sync", "time"] }
tokio-postgres.workspace = true
tokio-rustls = { workspace = true, features = ["tls12"] }
url.workspace = true
util.workspace = true
webpki-roots.workspace = true
zed_credentials_provider.workspace = true

[dev-dependencies]
db = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
